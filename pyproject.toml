[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "datamigration-agent"
version = "0.1.0"
description = "Governed LangGraph migration workbench with AWS, Azure, Databricks and semantic integration adapters"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.10,<3",
  "SQLAlchemy>=2,<3",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "filelock>=3.16,<4",
  "regex>=2024.11,<2027",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
mysql = ["pymysql>=1.1,<2"]
sqlserver = ["pyodbc>=5,<6"]
mongo = ["pymongo>=4.9,<5"]
redis = ["redis>=5,<8"]
cassandra = ["cassandra-driver>=3.29,<4"]
redshift = ["redshift-connector>=2.1,<3"]
delta = ["deltalake>=1,<2", "pyarrow>=17,<24"]
files = ["pyarrow>=17,<24"]
queries = ["sqlglot>=26,<31"]
mcp = ["mcp>=1.28,<2"]
databricks = ["databricks-sql-connector>=3,<5", "databricks-sdk>=0.40,<1"]
aws = ["boto3>=1.35,<2"]
azure = ["azure-identity>=1.19,<2", "azure-mgmt-datafactory>=9,<10"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "rdflib>=7,<8", "deltalake>=1,<2", "pyarrow>=17,<24", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pymongo>=4.9,<5", "redis>=5,<8", "sqlglot>=26,<31", "mcp>=1.28,<2", "a2a-sdk>=1,<2", "build>=1,<2"]

[project.scripts]
datamigrate = "datamigration.cli:main"
datamigrate-mcp = "datamigration.protocols.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datamigration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
